<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jukebox Star - Access Gateway</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #38bdf8;
            --accent: #818cf8;
            --text: #f8fafc;
            --danger: #f43f5e;
            --success: #10b981;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-sizing: border-box;
        }

        h1 {
            margin-bottom: 0.5rem;
            color: var(--primary);
            font-size: 1.5rem;
        }

        p {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .hidden {
            display: none !important;
        }

        button {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            border-radius: 0.5rem;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            margin-top: 1rem;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            margin-bottom: 1rem;
            border-radius: 0.5rem;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
            text-align: center;
        }

        .game-box {
            background: #0f172a;
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
        }

        .success-screen {
            text-align: center;
        }

        .success-screen a {
            display: inline-block;
            background-color: var(--success);
            color: white;
            text-decoration: none;
            padding: 1rem;
            border-radius: 0.5rem;
            font-weight: bold;
            width: 100%;
            box-sizing: border-box;
            margin-top: 1rem;
        }

        .lockout-timer {
            color: var(--danger);
            font-weight: bold;
            margin-top: 1rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- SEZIONE GATEWAY / MINIGIOCHI -->
        <div id="gateway-section">
            <h1>Jukebox Star</h1>
            <p>Supera il minigioco o inserisci il PIN Admin per accedere</p>

            <div id="game-container" class="game-box">
                <p id="game-instructions">Indovina il numero segreto (tra 1 e 10):</p>
                <input type="number" id="user-input" placeholder="Tuo tentativo...">
                <button onclick="checkGame()">Verifica</button>
                <p id="game-feedback" style="margin-top: 0.5rem; font-size: 0.85rem;"></p>
            </div>

            <div style="margin-top: 1.5rem; border-top: 1px solid #334155; padding-top: 1rem;">
                <p style="font-size: 0.8rem; margin-bottom: 0.5rem;">Sei l'amministratore?</p>
                <input type="password" id="admin-pin" placeholder="Inserisci PIN Admin">
                <button onclick="checkAdminPin()" style="background: #334155; font-size: 0.9rem; padding: 0.5rem;">Sblocca con PIN</button>
            </div>

            <div id="lockout-msg" class="lockout-timer hidden"></div>
        </div>

        <!-- SEZIONE SBLOCCATA (DOPO 3 CANZONI / ACCESSO) -->
        <div id="unlocked-section" class="success-screen hidden">
            <h1>Accesso Consentito! 🎉</h1>
            <p>Hai sbloccato la sessione per scegliere le tue canzoni.</p>
            
            <a href="https://www.jukeboxstar.com" target="_blank">Vai al Jukebox Star</a>

            <!-- Pulsante richiesto per riattivare il blocco -->
            <button onclick="lockAgain()" style="background-color: var(--danger); margin-top: 1.5rem;">Termina & Torna al Blocco</button>
        </div>
    </div>

    <script>
        // Logica Minogioco (Numero Segreto casuale)
        let secretNumber = Math.floor(Math.random() * 10) + 1;
        let attempts = 0;
        const maxAttempts = 3;

        function checkGame() {
            const inputVal = parseInt(document.getElementById('user-input').value);
            const feedback = document.getElementById('game-feedback');

            if (isNaN(inputVal)) {
                feedback.innerText = "Inserisci un numero valido!";
                return;
            }

            attempts++;

            if (inputVal === secretNumber) {
                unlockJukebox();
            } else if (attempts >= maxAttempts) {
                triggerLockout();
            } else {
                if (inputVal < secretNumber) {
                    feedback.innerText = `Tentativo ${attempts}/${maxAttempts}: Troppo basso!`;
                } else {
                    feedback.innerText = `Tentativo ${attempts}/${maxAttempts}: Troppo alto!`;
                }
            }
        }

        // Controllo PIN Admin (160379)
        function checkAdminPin() {
            const pin = document.getElementById('admin-pin').value;
            if (pin === "160379") {
                unlockJukebox();
            } else {
                alert("PIN non corretto!");
            }
        }

        // Sblocca l'interfaccia
        function unlockJukebox() {
            document.getElementById('gateway-section').classList.add('hidden');
            document.getElementById('unlocked-section').classList.remove('hidden');
        }

        // Funzione per riattivare il blocco e resettare il minigioco (Torna al game)
        function lockAgain() {
            // Pulisce i campi
            document.getElementById('user-input').value = "";
            document.getElementById('admin-pin').value = "";
            document.getElementById('game-feedback').innerText = "";
            
            // Genera un nuovo numero segreto per il prossimo utente
            secretNumber = Math.floor(Math.random() * 10) + 1;
            attempts = 0;

            // Torna alla schermata del gateway
            document.getElementById('unlocked-section').classList.add('hidden');
            document.getElementById('gateway-section').classList.remove('hidden');
        }

        // Gestione Timer di Lockout (120 secondi in caso di errore)
        function triggerLockout() {
            const gameBox = document.getElementById('game-container');
            const lockoutMsg = document.getElementById('lockout-msg');
            gameBox.classList.add('hidden');
            lockoutMsg.classList.remove('hidden');

            let timeLeft = 120; // 120 secondi
            lockoutMsg.innerText = `Troppi tentativi falliti. Riprova tra ${timeLeft}s`;

            let timer = setInterval(() => {
                timeLeft--;
                lockoutMsg.innerText = `Troppi tentativi falliti. Riprova tra ${timeLeft}s`;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    attempts = 0;
                    secretNumber = Math.floor(Math.random() * 10) + 1;
                    lockoutMsg.classList.add('hidden');
                    gameBox.classList.remove('hidden');
                    document.getElementById('game-feedback').innerText = "";
                }
            }, 1000);
        }
    </script>
</body>
</html>
